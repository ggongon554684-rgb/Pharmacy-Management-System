services:
  - type: web
    name: pharmacy-app
    runtime: php
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php -m | grep pdo_pgsql
      npm install && npm run build
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
      php artisan migrate --force
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_NAME
        value: PharmacyApp
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: pharmacy-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pharmacy-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: pharmacy-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: pharmacy-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pharmacy-db
          property: password
      - key: CACHE_DRIVER
        value: file
      - key: FILESYSTEM_DISK
        value: local
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: "120"
      - key: MAIL_MAILER
        value: log

databases:
  - name: pharmacy-db
    plan: free
    region: singapore